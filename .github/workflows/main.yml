name: Barf Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Cordova
        shell: bash
        run: |
          npm install -g cordova@13.0.0

      - name: Prepare Cordova project
        shell: bash
        run: |
          rm -rf build-app

          cordova create build-app com.barf.app "برف"

          cp index.html build-app/www/index.html
          cp config.xml build-app/config.xml

          if [ -f service-worker.js ]; then
            cp service-worker.js build-app/www/service-worker.js
          fi

          if [ -f sw.js ]; then
            cp sw.js build-app/www/sw.js
          fi

          if [ -f manifest.json ]; then
            cp manifest.json build-app/www/manifest.json
          fi

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest build-app/www/manifest.webmanifest
          fi

          if [ -f icon-192.png ]; then
            cp icon-192.png build-app/www/icon-192.png
          fi

          if [ -f icon-512.png ]; then
            cp icon-512.png build-app/www/icon-512.png
          fi

          cd build-app
          cordova platform add android@15.0.0

      - name: Build Release APK
        shell: bash
        working-directory: build-app
        run: |
          cordova build android --release

      - name: Sign APK
        shell: bash
        env:
          KS_B64: ${{ secrets.BARF_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BARF_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.BARF_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BARF_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KS_B64" ]; then
            echo "BARF_KEYSTORE_BASE64 is missing"
            exit 1
          fi

          if [ -z "$KS_PASS" ]; then
            echo "BARF_KEYSTORE_PASSWORD is missing"
            exit 1
          fi

          if [ -z "$ALIAS" ]; then
            echo "BARF_KEY_ALIAS is missing"
            exit 1
          fi

          if [ -z "$KEY_PASS" ]; then
            echo "BARF_KEY_PASSWORD is missing"
            exit 1
          fi

          echo "$KS_B64" | base64 --decode > barf-release.jks

          zipalign -p -f 4 \
            build-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

          apksigner sign \
            --ks barf-release.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out barf-cafebazaar-release.apk \
            aligned.apk

          apksigner verify --verbose barf-cafebazaar-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: barf-cafebazaar-release
          path: barf-cafebazaar-release.apk
          if-no-files-found: error
