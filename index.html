const persianNumberWords=n=>{
  n=Math.floor(Math.abs(Number(n)||0));
  const ones=["","یک","دو","سه","چهار","پنج","شش","هفت","هشت","نه"];
  const teens=["ده","یازده","دوازده","سیزده","چهارده","پانزده","شانزده","هفده","هجده","نوزده"];
  const tens=["","","بیست","سی","چهل","پنجاه","شصت","هفتاد","هشتاد","نود"];
  const hundreds=["","صد","دویست","سیصد","چهارصد","پانصد","ششصد","هفتصد","هشتصد","نهصد"];
  const scales=["","هزار","میلیون","میلیارد","تریلیون","کوادریلیون"];
  const chunk=x=>{
    const a=[];
    const h=Math.floor(x/100), r=x%100;
    if(h)a.push(hundreds[h]);
    if(r){ if(r<10)a.push(ones[r]); else if(r<20)a.push(teens[r-10]); else {a.push(tens[Math.floor(r/10)]); if(r%10)a.push(ones[r%10]);}}
    return a.join(" و ");
  };
  if(n===0)return "صفر";
  const out=[]; let i=0;
  while(n>0){const c=n%1000;if(c)out.unshift(chunk(c)+(scales[i]?" "+scales[i]:""));n=Math.floor(n/1000);i++;}
  return out.join(" و ");
};

window.addEventListener("popstate",()=>{

  if(invoiceViewing){
    invoiceViewing=false;
    closeModal();
    return;
  }
  if(invoiceFormViewing){
    invoiceFormViewing=false;
    closeModal();
    return;
  }
  if(currentPage!=="home"){
    barfBackLock=true;
    render("home",false);

});

window.doLogin=async function(){
 const email=(document.getElementById("authEmail")?.value||"").trim().toLowerCase();

 try{
   const r=await sb.auth.signInWithPassword({email,password});
   if(r.error){ const msg=String(r.error.message||r.error||""); if(/fetch|failed to fetch|network|networkerror|failed to load|connection|offline/i.test(msg))return authScreen("اینترنت خود را بررسی کنید"); return authScreen("ورود ناموفق بود: "+msg); }
   currentUser=r.data.user;
   document.body.classList.remove("authMode");
   try{await loadData();render("home");}
   catch(e){authScreen("بارگذاری اطلاعات با خطا مواجه شد: "+e.message);}

async function loadData(){
 const [c,p,i,e]=await Promise.all([
  sb.from("customers").select("*").order("id"),
  sb.from("products").select("*").order("id"),
  sb.from("invoices").select("*").order("invoice_no",{ascending:false}),
  sb.from("expenses").select("*").order("created_at",{ascending:false})
 ]);
 for(const r of [c,p,i,e])if(r.error)throw r.error;
 data.customers=(c.data||[]).map(x=>({id:x.id,name:x.name,phone:x.phone||"",debt:+x.debt||0,purchases:+x.total_purchases||0}));
 data.products=(p.data||[]).map(x=>({id:x.id,name:x.name,unit:x.unit||"عدد",buy:+x.buy_price||0,sell:+x.sell_price||0,stock:+x.stock||0,min:+x.min_stock||0}));
 data.invoices=(i.data||[]).map(x=>({id:x.id,no:Math.abs(+x.invoice_no||0),customerId:x.customer_id,customer:x.customer_name||"مشتری متفرقه",total:+x.total||0,paid:+x.paid||0,remaining:+x.remaining||0,date:x.invoice_date || new Intl.DateTimeFormat("fa-IR").format(new Date(x.created_at))}));
 data.expenses=(e.data||[]).map(x=>({id:x.id,title:x.title,amount:+x.amount||0,note:x.note||x.description||"",date:new Intl.DateTimeFormat("fa-IR").format(new Date(x.created_at)),currency:getExpenseCurrency(x.id)}));
}

sb.auth.onAuthStateChange((event, session)=>{
 currentUser=session?.user||null;
 if(event==="PASSWORD_RECOVERY"){ document.body.classList.add("authMode"); resetPasswordScreen(); return; }
 if(event==="SIGNED_OUT" && !currentUser) authScreen();
});

async function start(){
 try{
   const recoveryLink = /(^|[&#])type=recovery(&|#|$)/.test(window.location.hash) ||
                        new URLSearchParams(window.location.search).get("type")==="recovery";
   if(recoveryLink){
     document.body.classList.add("authMode");
     resetPasswordScreen();
     return;
   }
   const s=await sb.auth.getSession();
   currentUser=s.data.session?.user||null;
   if(!currentUser){authScreen();return;}
   document.body.classList.remove("authMode");
   await loadData();
   prepareHomeHistory();
   render("home",false);
 }catch(e){
   authScreen("خطا در بارگذاری: "+(e.message||e));
 }
}

const jalaliMonthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const jalaliWeekNames=['ش','ی','د','س','چ','پ','ج'];
const faDigits=s=>String(s).replace(/\d/g,n=>'۰۱۲۳۴۵۶۷۸۹'[n]);
const jalaliToday=()=>faDigits(new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replace(/-/g,'/'));
const jalaliParts=()=>{
  const a=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
  return {y:+a.find(x=>x.type==='year').value,m:+a.find(x=>x.type==='month').value,d:+a.find(x=>x.type==='day').value};
};
const jalaliLeap=y=>[1,5,9,13,17,22,26,30].includes((y+12)%33);
const jalaliMonthDays=(y,m)=>m<=6?31:m<=11?30:(jalaliLeap(y)?30:29);
const jalaliToDayIndex=(y,m,d)=>{
  const gy=y-1;
  let days=(gy*365)+Math.floor((gy+3)/4)-Math.floor((gy+99)/100)+Math.floor((gy+399)/400);
  days+=(m<=7?(m-1)*31:(m-1)*30-6)+d;
  return days;
};
const jalaliWeekday=(y,m,d)=>((jalaliToDayIndex(y,m,d)+2)%7);
let jalaliPickerState={y:0,m:0,target:'',selected:''};
window.closeJalaliPicker=()=>{document.getElementById('jalaliPickerOverlay')?.remove()};
window.selectJalaliDate=(y,m,d)=>{
  const value=faDigits(`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
  const el=document.getElementById(jalaliPickerState.target);
  if(el){el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}));}
  closeJalaliPicker();
};
window.renderJalaliPicker=()=>{
  const o=document.getElementById('jalaliPickerOverlay'); if(!o)return;
  const y=jalaliPickerState.y,m=jalaliPickerState.m,selected=jalaliPickerState.selected;
  const first=jalaliWeekday(y,m,1),count=jalaliMonthDays(y,m);
  let cells='';
  for(let i=0;i<first;i++)cells+='<button class="jalaliDay empty" tabindex="-1"></button>';
  for(let d=1;d<=count;d++){
    const v=`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
    const cls=v===selected?' today':'';
    cells+=`<button type="button" class="jalaliDay${cls}" onclick="selectJalaliDate(${y},${m},${d})">${String(d).replace(/\d/g,n=>'۰۱۲۳۴۵۶۷۸۹'[n])}</button>`;
  }
  o.innerHTML=`<div class="jalaliPicker" role="dialog" aria-modal="true">
    <div class="jalaliPickerHead"><button type="button" onclick="changeJalaliMonth(-1)">‹</button><div class="jalaliPickerTitle">${jalaliMonthNames[m-1]} ${String(y).replace(/\d/g,n=>'۰۱۲۳۴۵۶۷۸۹'[n])}</div><button type="button" onclick="changeJalaliMonth(1)">›</button></div>
    <div class="jalaliWeek">${jalaliWeekNames.map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="jalaliGrid">${cells}</div>
    <div class="jalaliPickerFoot"><span class="jalaliSelected">${selected?'انتخاب شده: '+faDigits(selected):'یک تاریخ را انتخاب کنید'}</span><button type="button" class="jalaliTodayBtn" onclick="jalaliPickerToday()">امروز</button></div>
  </div>`;
};
window.changeJalaliMonth=delta=>{
  jalaliPickerState.m+=delta;
  if(jalaliPickerState.m<1){jalaliPickerState.m=12;jalaliPickerState.y--}
  if(jalaliPickerState.m>12){jalaliPickerState.m=1;jalaliPickerState.y++}
  renderJalaliPicker();
};
window.jalaliPickerToday=()=>{const t=jalaliParts();jalaliPickerState.y=t.y;jalaliPickerState.m=t.m;renderJalaliPicker()};
window.openJalaliPicker=target=>{
  const el=document.getElementById(target);const current=(el?.value||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  let [y,m,d]=current.split('/').map(Number);const t=jalaliParts();
  if(!y||!m||!d){y=t.y;m=t.m;d=t.d}
  jalaliPickerState={y,m,target,selected:current||`${t.y}/${String(t.m).padStart(2,'0')}/${String(t.d).padStart(2,'0')}`};
  let o=document.getElementById('jalaliPickerOverlay');
  if(!o){o=document.createElement('div');o.id='jalaliPickerOverlay';o.className='jalaliPickerOverlay';o.onclick=e=>{if(e.target===o)closeJalaliPicker()};document.body.appendChild(o)}
  renderJalaliPicker();
};

window.saveCheck=(type)=>{
  const no=(document.getElementById('checkNo')?.value||'').trim();

  const receiver=(document.getElementById('checkReceiver')?.value||'').trim();

  const amount=toToman(inputAmount,appCurrency());
  const reason=(document.getElementById('checkReason')?.value||'').trim();
  const bank=(document.getElementById('checkBank')?.value||'').trim();
  const note=(document.getElementById('checkNote')?.value||'').trim();

async function normalizePurchaseInvoiceNumbers(){
  const purchaseIds=data.invoices.filter(i=>getInvoiceType(i.id)==="purchase" && Number(i.no)>0).map(i=>i.id);
  for(const id of purchaseIds){
    const inv=data.invoices.find(x=>String(x.id)===String(id));
    if(!inv) continue;
    const r=await sb.from("invoices").update({invoice_no:-Math.abs(Number(inv.no)||0)}).eq("id",id).eq("user_id",currentUser.id);
    if(r.error) throw r.error;
  }
}

const nextInvoiceNumber=(invoiceType)=>{

};

    const sel=document.getElementById("ic"); if(sel) sel.value=inv.customer_id?String(inv.customer_id):"";
    const sub=currentInvoiceItems.reduce((a,b)=>a+b.total,0);
    const total=fromToman(Number(inv.total)||0,unit);
    const paid=fromToman(Number(inv.paid)||0,unit);
    const discAmount=fromToman(Number(inv.discount)||0,unit);

window.saveInvoice=async()=>{
if(!currentInvoiceItems.length){alert("حداقل یک محصول اضافه کنید");return;}

let sub=currentInvoiceItems.reduce((a,b)=>a+b.total,0);
let discPercent=+document.getElementById("disc").value||0;
let discountAmount = sub * (discPercent / 100);
let total=Math.max(0, sub - discountAmount);
let pay=Math.min(total,+document.getElementById("paid").value||0);
let remaining=total-pay;
let invoiceUnit=currencyUnit();
let dbSub=toToman(sub,invoiceUnit),dbDiscount=toToman(discountAmount,invoiceUnit),dbTotal=toToman(total,invoiceUnit),dbPay=toToman(pay,invoiceUnit),dbRemaining=toToman(remaining,invoiceUnit);
let cid=document.getElementById("ic").value||null;
let c=cid?data.customers.find(x=>String(x.id)===cid):null;
function faToEnDigits(value){
  return String(value ?? "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
}

let no=+faToEnDigits(document.getElementById("invoiceNo").value)||nextInvoiceNumber(window._invoiceType||"sale");
let invoiceDate=document.getElementById("invDate").value;
let invoiceType=window._invoiceType||"sale";

try{await normalizePurchaseInvoiceNumbers();}catch(e){return alert("خطا در آماده‌سازی شماره فاکتورهای خرید:\n"+e.message);}

let storedInvoiceNo=invoiceType==="purchase" ? -Math.abs(no) : Math.abs(no);
if(window._editingInvoiceId){
  const editId=window._editingInvoiceId;
  const oldInv=data.invoices.find(x=>String(x.id)===String(editId));
  if(!oldInv)return alert("فاکتور برای ویرایش پیدا نشد.");
  const oldItemsR=await sb.from("invoice_items").select("*").eq("invoice_id",editId).eq("user_id",currentUser.id);
  if(oldItemsR.error)return alert(oldItemsR.error.message);
  for(const x of (oldItemsR.data||[])){
    if(x.product_id){
      const p=data.products.find(pp=>String(pp.id)===String(x.product_id));
      if(p){
        const restored=invoiceType==="purchase" ? p.stock-Number(x.quantity||0) : p.stock+Number(x.quantity||0);
        await sb.from("products").update({stock:restored}).eq("id",p.id).eq("user_id",currentUser.id);
      }
    }
  }
  let ur=await sb.from("invoices").update({invoice_no:storedInvoiceNo,invoice_date:invoiceDate,customer_id:cid?+cid:null,customer_name:c?.name||"مشتری متفرقه",subtotal:dbSub,discount:dbDiscount,total:dbTotal,paid:dbPay,remaining:dbRemaining}).eq("id",editId).eq("user_id",currentUser.id);
  if(ur.error)return alert("خطا در ویرایش فاکتور:\n"+ur.error.message);
  let dr=await sb.from("invoice_items").delete().eq("invoice_id",editId).eq("user_id",currentUser.id);
  if(dr.error)return alert("خطا در به‌روزرسانی اقلام فاکتور:\n"+dr.error.message);
  let ir2=await sb.from("invoice_items").insert(currentInvoiceItems.map(x=>({user_id:currentUser.id,invoice_id:editId,product_id:x.p.id,product_name:x.p.name+" | مدل: "+(x.model||'-'),quantity:x.q,unit_price:toToman(x.unit,invoiceUnit),line_total:toToman(x.total,invoiceUnit)})));
  if(ir2.error)return alert("خطا در ثبت اقلام جدید:\n"+ir2.error.message);
  for(const x of currentInvoiceItems){if(x.p.id){const p=data.products.find(pp=>String(pp.id)===String(x.p.id));const base=p?p.stock:0;const newStock=invoiceType==="purchase"?base+x.q:base-x.q;await sb.from("products").update({stock:newStock}).eq("id",x.p.id).eq("user_id",currentUser.id);}}
  setInvoiceCurrency(editId,invoiceUnit);setInvoiceType(editId,invoiceType);
  setInvoiceDisplayOptions(editId,{storeTitle:!!document.getElementById("optStoreTitle")?.checked,customerPhone:!!document.getElementById("optCustomerPhone")?.checked,address:!!document.getElementById("optAddress")?.checked,orderCode:!!document.getElementById("optOrderCode")?.checked,storeTitleText:(document.getElementById("invoiceStoreTitle")?.value||"برف").trim(),customerPhoneText:(document.getElementById("invoiceCustomerPhone")?.value||"").trim(),addressText:(document.getElementById("invoiceAddress")?.value||"").trim(),orderCodeText:(document.getElementById("invoiceOrderCode")?.value||"").trim()});
  window._editingInvoiceId=null; await loadData(); closeModal(); showInvoice(editId); return;
}
let inv=await sb.from("invoices").insert({
  user_id:currentUser.id,
  invoice_no:storedInvoiceNo,
  invoice_date:invoiceDate,
  customer_id:cid?+cid:null,
  customer_name:c?.name||"مشتری متفرقه",
  subtotal:dbSub,
  discount:dbDiscount,
  total:dbTotal,
  paid:dbPay,
  remaining:dbRemaining
}).select().single();
if(inv.error){
  const msg=String(inv.error.message||"");

  if(
    msg.includes("duplicate key") ||

function getInvoiceSignature(id,role="seller"){
  try{const m=JSON.parse(localStorage.getItem("barfInvoiceSignatures")||"{}"); if(typeof m[id]==="object") return m[id]?.[role]||""; return role==="seller"?(m[id]||""):"";}catch(e){return "";}
}
function setInvoiceSignature(id,data,role="seller"){
  let m={}; try{m=JSON.parse(localStorage.getItem("barfInvoiceSignatures")||"{}")}catch(e){}
  const old=typeof m[id]==="string"?m[id]:""; const obj=typeof m[id]==="object"&&m[id]?m[id]:{};
  if(old&&!obj.seller)obj.seller=old;
  if(data)obj[role]=data;else delete obj[role];
  if(obj.customer||obj.seller)m[id]=obj;else delete m[id];
  localStorage.setItem("barfInvoiceSignatures",JSON.stringify(m));
}

};
window.changeInvoiceLogoSize=(delta)=>{
  logoState.size=Math.max(40,Math.min(150,(Number(logoState.size)||72)+delta));
  localStorage.setItem(logoStateKey,JSON.stringify(logoState));
  window.applyInvoiceLogoState();
};
window.applyInvoiceLogoState();
const dragImg=document.getElementById("invoiceLogoPreview");
if(dragImg){
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  dragImg.style.touchAction="none";
  const startDrag=e=>{
    if(e.pointerType==="mouse" && e.button!==0)return;
    e.preventDefault(); e.stopPropagation(); dragging=true;
    try{dragImg.setPointerCapture(e.pointerId);}catch(err){}
    sx=e.clientX; sy=e.clientY; ox=Number(logoState.x)||0; oy=Number(logoState.y)||0;
  };
  const moveDrag=e=>{
    if(!dragging)return;
    e.preventDefault(); e.stopPropagation();
    logoState.x=ox+(e.clientX-sx); logoState.y=oy+(e.clientY-sy);
    window.applyInvoiceLogoState();
  };
  const endDrag=e=>{
    if(!dragging)return;
    if(e)e.preventDefault(); dragging=false;
    try{dragImg.releasePointerCapture(e.pointerId);}catch(err){}
    localStorage.setItem(logoStateKey,JSON.stringify(logoState));
  };
  dragImg.addEventListener("pointerdown",startDrag,{passive:false});
  dragImg.addEventListener("pointermove",moveDrag,{passive:false});
  dragImg.addEventListener("pointerup",endDrag,{passive:false});
  dragImg.addEventListener("pointercancel",endDrag,{passive:false});
}
};

window.deleteInvoice=async id=>{
 if(!confirm("آیا از حذف این فاکتور اطمینان دارید؟"))return;
 const inv=data.invoices.find(x=>String(x.id)===String(id));
 if(!inv)return alert("فاکتور یافت نشد.");
 let r=await sb.from("invoices").delete().eq("id",id).eq("user_id",currentUser.id);
 if(r.error)return alert(r.error.message);
 await loadData();
 render(document.querySelector(".side button.active")?.getAttribute("data-page")||"home");
};



start();
})();
</script>
