window.forgotPassword=async function(){
 const email=(document.getElementById("authEmail")?.value||"").trim().toLowerCase();
 if(!email)return authScreen("ابتدا ایمیل خود را وارد کنید، سپس روی بازیابی رمز بزنید.");
 try{
   const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});
   if(r.error)return authScreen("ارسال لینک بازیابی ناموفق بود: "+r.error.message);
   authScreen("لینک بازیابی رمز به ایمیل شما ارسال شد. ایمیل را باز کنید و رمز جدید را تعیین کنید.");

window.doLogin=async function(){
 const email=(document.getElementById("authEmail")?.value||"").trim().toLowerCase();
 const password=document.getElementById("authPass")?.value||"";
 if(!email||!password)return authScreen("ایمیل و رمز عبور را وارد کنید.");
 try{
   const r=await sb.auth.signInWithPassword({email,password});
   if(r.error)return authScreen("ورود ناموفق بود: "+r.error.message);
   currentUser=r.data.user;
   document.body.classList.remove("authMode");
   try{await loadData();render("home");}
   catch(e){authScreen("بارگذاری اطلاعات با خطا مواجه شد: "+e.message);}

   authScreen("ارتباط با سرور انجام نشد. اینترنت را بررسی کنید.");
 }
};

async function loadData(){
 const [c,p,i,e]=await Promise.all([
  sb.from("customers").select("*").order("id"),
  sb.from("products").select("*").order("id"),
  sb.from("invoices").select("*").order("invoice_no",{ascending:false}),
  sb.from("expenses").select("*").order("created_at",{ascending:false})
 ]);
 for(const r of [c,p,i,e])if(r.error)throw r.error;
 data.customers=(c.data||[]).map(x=>({id:x.id,name:x.name,phone:x.phone||"",debt:+x.debt||0,purchases:+x.total_purchases||0}));
 data.products=(p.data||[]).map(x=>({id:x.id,name:x.name,unit:x.unit||"عدد",buy:+x.buy_price||0,sell:+x.sell_price||0,stock:+x.stock||0,min:+x.min_stock||0}));
 data.invoices=(i.data||[]).map(x=>({id:x.id,no:x.invoice_no,customerId:x.customer_id,customer:x.customer_name||"مشتری متفرقه",total:+x.total||0,paid:+x.paid||0,remaining:+x.remaining||0,date:x.invoice_date || new Intl.DateTimeFormat("fa-IR").format(new Date(x.created_at))}));
 data.expenses=(e.data||[]).map(x=>({id:x.id,title:x.title,amount:+x.amount||0,note:x.note||x.description||"",date:new Intl.DateTimeFormat("fa-IR").format(new Date(x.created_at)),currency:getExpenseCurrency(x.id)}));
}

window.updatePassword=async function(){
 const a=document.getElementById("newPass")?.value||"", b=document.getElementById("newPass2")?.value||"";
 if(a.length<6)return alert("رمز عبور باید حداقل ۶ کاراکتر باشد.");
 if(a!==b)return alert("رمزهای عبور یکسان نیستند.");
 try{
  const r=await sb.auth.updateUser({password:a});
  if(r.error)return alert("تغییر رمز ناموفق بود: "+r.error.message);
  alert("رمز عبور با موفقیت تغییر کرد.");
  history.replaceState({},document.title,window.location.pathname);
  document.body.classList.remove("authMode");
  await loadData(); render("home");
 }catch(e){ alert("تغییر رمز انجام نشد. دوباره تلاش کنید."); }
};

sb.auth.onAuthStateChange((event, session)=>{
 currentUser=session?.user||null;
 if(event==="PASSWORD_RECOVERY"){ document.body.classList.add("authMode"); resetPasswordScreen(); return; }
 if(event==="SIGNED_OUT" && !currentUser) authScreen();
});

async function start(){
 try{
   const recoveryLink = /(^|[&#])type=recovery(&|#|$)/.test(window.location.hash) ||
                        new URLSearchParams(window.location.search).get("type")==="recovery";
   if(recoveryLink){
     document.body.classList.add("authMode");
     resetPasswordScreen();
     return;
   }
   const s=await sb.auth.getSession();
   currentUser=s.data.session?.user||null;
   if(!currentUser){authScreen();return;}
   document.body.classList.remove("authMode");
   await loadData();
   prepareHomeHistory();
   render("home",false);
 }catch(e){
   authScreen("خطا در بارگذاری: "+(e.message||e));
 }
}

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-page]");
  if(btn){
    const pageName = btn.getAttribute("data-page");
    if(pageName){
      render(pageName);
    }
  }
});

function render(p,pushHistory=true){
 if(!currentUser)return authScreen();

 if(pushHistory && p!=="home"){
   // همهٔ صفحات داخلی فقط یک قدم بعد از خانه هستند.
   history.replaceState({barfApp:true,page:p},"",homeUrl()+"#"+p);
 }else if(p==="home" && pushHistory){
   prepareHomeHistory();
 }

 nav(p);
 ({home,sales,customers,products,finance,reports}[p]||home)();
}

const persianToday=()=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const persianDigits=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const validPersianDate=s=>/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(persianDigits(s).replace(/-/g,'/'));
const getChecks=()=>{try{return JSON.parse(localStorage.getItem('barfChecks')||'[]')}catch(e){return[]}};
const setChecks=a=>localStorage.setItem('barfChecks',JSON.stringify(a));
const isoToday=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const isoToPersian=iso=>{if(!iso)return '';const d=new Date(iso+'T12:00:00');return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};
const checkSort=(a,b)=>String(a.no||'').localeCompare(String(b.no||''),'fa',{numeric:true,sensitivity:'base'});
const checkMoney=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';


const jalaliMonthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const jalaliWeekNames=['ش','ی','د','س','چ','پ','ج'];
const faDigits=s=>String(s).replace(/\d/g,n=>'۰۱۲۳۴۵۶۷۸۹'[n]);
const jalaliToday=()=>faDigits(new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replace(/-/g,'/'));
const jalaliParts=()=>{
  const a=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
  return {y:+a.find(x=>x.type==='year').value,m:+a.find(x=>x.type==='month').value,d:+a.find(x=>x.type==='day').value};
};
const jalaliLeap=y=>[1,5,9,13,17,22,26,30].includes((y+12)%33);
const jalaliMonthDays=(y,m)=>m<=6?31:m<=11?30:(jalaliLeap(y)?30:29);
const jalaliToDayIndex=(y,m,d)=>{
  const gy=y-1;
  let days=(gy*365)+Math.floor((gy+3)/4)-Math.floor((gy+99)/100)+Math.floor((gy+399)/400);
  days+=(m<=7?(m-1)*31:(m-1)*30-6)+d;
  return days;
};
const jalaliWeekday=(y,m,d)=>((jalaliToDayIndex(y,m,d)+2)%7);
let jalaliPickerState={y:0,m:0,target:'',selected:''};
window.closeJalaliPicker=()=>{document.getElementById('jalaliPickerOverlay')?.remove()};
window.selectJalaliDate=(y,m,d)=>{
  const value=faDigits(`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
  const el=document.getElementById(jalaliPickerState.target);
  if(el){el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}));}
  closeJalaliPicker();
};
window.renderJalaliPicker=()=>{
  const o=document.getElementById('jalaliPickerOverlay'); if(!o)return;
  const y=jalaliPickerState.y,m=jalaliPickerState.m,selected=jalaliPickerState.selected;
  const first=jalaliWeekday(y,m,1),count=jalaliMonthDays(y,m);
  let cells='';
  for(let i=0;i<first;i++)cells+='<button class="jalaliDay empty" tabindex="-1"></button>';
  for(let d=1;d<=count;d++){
    const v=`${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
    const cls=v===selected?' today':'';
    cells+=`<button type="button" class="jalaliDay${cls}" onclick="selectJalaliDate(${y},${m},${d})">${String(d).replace(/\d/g,n=>'۰۱۲۳۴۵۶۷۸۹'[n])}</button>`;
  }
  o.innerHTML=`<div class="jalaliPicker" role="dialog" aria-modal="true">
    <div class="jalaliPickerHead"><button type="button" onclick="changeJalaliMonth(-1)">‹</button><div class="jalaliPickerTitle">${jalaliMonthNames[m-1]} ${String(y).replace(/\d/g,n=>'۰۱۲۳۴۵۶۷۸۹'[n])}</div><button type="button" onclick="changeJalaliMonth(1)">›</button></div>
    <div class="jalaliWeek">${jalaliWeekNames.map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="jalaliGrid">${cells}</div>
    <div class="jalaliPickerFoot"><span class="jalaliSelected">${selected?'انتخاب شده: '+faDigits(selected):'یک تاریخ را انتخاب کنید'}</span><button type="button" class="jalaliTodayBtn" onclick="jalaliPickerToday()">امروز</button></div>
  </div>`;
};
window.changeJalaliMonth=delta=>{
  jalaliPickerState.m+=delta;
  if(jalaliPickerState.m<1){jalaliPickerState.m=12;jalaliPickerState.y--}
  if(jalaliPickerState.m>12){jalaliPickerState.m=1;jalaliPickerState.y++}
  renderJalaliPicker();
};
window.jalaliPickerToday=()=>{const t=jalaliParts();jalaliPickerState.y=t.y;jalaliPickerState.m=t.m;renderJalaliPicker()};
window.openJalaliPicker=target=>{
  const el=document.getElementById(target);const current=(el?.value||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  let [y,m,d]=current.split('/').map(Number);const t=jalaliParts();
  if(!y||!m||!d){y=t.y;m=t.m;d=t.d}
  jalaliPickerState={y,m,target,selected:current||`${t.y}/${String(t.m).padStart(2,'0')}/${String(t.d).padStart(2,'0')}`};
  let o=document.getElementById('jalaliPickerOverlay');
  if(!o){o=document.createElement('div');o.id='jalaliPickerOverlay';o.className='jalaliPickerOverlay';o.onclick=e=>{if(e.target===o)closeJalaliPicker()};document.body.appendChild(o)}
  renderJalaliPicker();
};

window.updateInvoiceCurrency=()=>{
  let next=currencyUnit();
  let prev=window._invoiceCurrency||"تومان";
  if(prev===next){updateInvoiceTotals();return;}
  let ratio=currencyFactor(next)/currencyFactor(prev);
  currentInvoiceItems=currentInvoiceItems.map(x=>({...x,unit:x.unit*ratio,total:x.total*ratio}));
  let paid=document.getElementById("paid");
  if(paid) paid.value=(+paid.value||0)*ratio;
  window._invoiceCurrency=next;
  renderInvoiceItems();
  updateInvoiceTotals();
};

function updateInvoiceTotals(){
let sub=currentInvoiceItems.reduce((a,b)=>a+b.total,0);
let discPercent=+document.getElementById("disc")?.value||0;
let discountAmount = sub * (discPercent / 100);
let total=Math.max(0, sub - discountAmount);
let p=+document.getElementById("paid")?.value||0;
let remain=Math.max(0, total-p);

let unit=currencyUnit();
if(document.getElementById("sub")) document.getElementById("sub").textContent=money(sub,unit);
if(document.getElementById("total")) document.getElementById("total").textContent=money(total,unit);
if(document.getElementById("remain")) document.getElementById("remain").textContent=money(remain,unit);
}

window.saveInvoice=async()=>{
if(!currentInvoiceItems.length){alert("حداقل یک محصول اضافه کنید");return;}

let sub=currentInvoiceItems.reduce((a,b)=>a+b.total,0);
let discPercent=+document.getElementById("disc").value||0;
let discountAmount = sub * (discPercent / 100);
let total=Math.max(0, sub - discountAmount);
let pay=Math.min(total,+document.getElementById("paid").value||0);
let remaining=total-pay;
let invoiceUnit=currencyUnit();
let dbSub=toToman(sub,invoiceUnit),dbDiscount=toToman(discountAmount,invoiceUnit),dbTotal=toToman(total,invoiceUnit),dbPay=toToman(pay,invoiceUnit),dbRemaining=toToman(remaining,invoiceUnit);
let cid=document.getElementById("ic").value||null;
let c=cid?data.customers.find(x=>String(x.id)===cid):null;
function faToEnDigits(value){
  return String(value ?? "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
}

let no=+faToEnDigits(document.getElementById("invoiceNo").value)||(data.invoices.reduce((m,x)=>Math.max(m,+x.no||0),1023)+1);
let invoiceDate=document.getElementById("invDate").value;
let invoiceType=window._invoiceType||"sale";

let inv=await sb.from("invoices").insert({
  user_id:currentUser.id,
  invoice_no:no,
  invoice_date:invoiceDate,
  customer_id:cid?+cid:null,
  customer_name:c?.name||"مشتری متفرقه",
  subtotal:dbSub,
  discount:dbDiscount,
  total:dbTotal,
  paid:dbPay,
  remaining:dbRemaining
}).select().single();
if(inv.error){
  const msg=String(inv.error.message||"");

  if(
    msg.includes("duplicate key") ||
    msg.includes("invoices_invoice_no_key")
  ){
    return alert(
      "شماره فاکتور تکراری است.\n\n" +
      "این شماره قبلاً برای یک فاکتور استفاده شده است.\n" +
      "لطفاً شماره فاکتور دیگری وارد کنید."
    );
  }

  return alert("خطا در ثبت فاکتور:\n" + msg);
}

let ir=await sb.from("invoice_items").insert(currentInvoiceItems.map(x=>({user_id:currentUser.id,invoice_id:inv.data.id,product_id:x.p.id,product_name:x.p.name+" | مدل: "+(x.model||'-'),quantity:x.q,unit_price:toToman(x.unit,invoiceUnit),line_total:toToman(x.total,invoiceUnit)})));
if(ir.error){await sb.from("invoices").delete().eq("id",inv.data.id);return alert(ir.error.message)}

for(const x of currentInvoiceItems){
  if(x.p.id){
    const newStock=invoiceType==="purchase" ? x.p.stock+x.q : x.p.stock-x.q;
    await sb.from("products").update({stock:newStock}).eq("id",x.p.id).eq("user_id",currentUser.id);
  }
}
if(c && invoiceType==="sale"){
  await sb.from("customers").update({total_purchases:c.purchases+dbTotal,debt:c.debt+dbRemaining}).eq("id",c.id).eq("user_id",currentUser.id);
}
setInvoiceCurrency(inv.data.id,invoiceUnit);
setInvoiceType(inv.data.id,invoiceType);
await loadData();closeModal();showInvoice(inv.data.id);
};

    border:none;
    background:transparent;
    border-radius:0;
    cursor:pointer;
    padding:0;
  ">
    <img id="invoiceLogoPreview"
         src=""
         style="width:100%;height:100%;object-fit:contain;border-radius:8px;display:none;">

    <div id="invoiceLogoText" class="noPrint" style="
      color:#176b5b;
      font-size:13px;
      font-weight:bold;
      padding-top:18px;
    ">
      🖼️<br>انتخاب لوگو
    </div>
  </label>

  <button id="removeInvoiceLogoBtn" class="noPrint"
          type="button"
          onclick="
            localStorage.removeItem('barfInvoiceLogo');
            document.getElementById('invoiceLogoPreview').src='';
            document.getElementById('invoiceLogoPreview').style.display='none';
            document.getElementById('invoiceLogoText').style.display='block';
            document.getElementById('invoiceLogoWrap').classList.add('noLogo');
            document.getElementById('invoiceLogoInput').value='';
            this.style.display='none';
          "
          style="
            display:none;
            position:absolute;
            left:-7px;
            top:3px;
            width:18px;
            height:18px;
            padding:0;
            border:none;
            border-radius:50%;
            background:#e53935;
            color:white;
            font-size:15px;
            line-height:18px;
            text-align:center;
            cursor:pointer;
            z-index:10;
          ">×</button>

</div>
    <input id="invoiceLogoInput" class="noPrint"
           type="file"
           accept="image/*"
           style="display:none"
           onchange="
             const file=this.files[0];
             if(file){
               const reader=new FileReader();
               reader.onload=function(e){
                 document.getElementById('invoiceLogoPreview').src=e.target.result;
                 document.getElementById('invoiceLogoPreview').style.display='block';
                 document.getElementById('invoiceLogoText').style.display='none';
                 document.getElementById('removeInvoiceLogoBtn').style.display='block';
                 document.getElementById('invoiceLogoWrap').classList.remove('noLogo');
                 localStorage.setItem('barfInvoiceLogo',e.target.result);
               };
               reader.readAsDataURL(file);
             }
           ">
  </div>

  <!-- عنوان وسط -->
  <div style="
    text-align:center;
    padding-top:5px;
    margin-bottom:18px;
  ">
    <div style="
      font-size:20px;
      font-weight:800;
      color:#176b5b;
      line-height:1.5;
    ">
      ${invoiceTitle}
    </div>
  </div>

  <!-- اطلاعات فاکتور -->
  <div style="
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
  ">

    <!-- سمت راست: مشتری -->
    <div style="
      flex:1;
      background:#f1f8f6;
      border-radius:12px;
      padding:10px 14px;
    ">
      <div style="
        font-size:12px;
        color:#777;
        margin-bottom:5px;
      ">
        👤 نام ${partyLabel}
      </div>

      <div style="
        font-size:16px;
        font-weight:bold;
        color:#111;
      ">
        ${esc(i.customer)}
      </div>
    </div>

    <!-- سمت چپ: تاریخ و شماره -->
    <div style="
      flex:1;
      text-align:left;
      font-size:13px;
      line-height:2;
      color:#333;
    ">
      <div>
        <b>شماره فاکتور:</b>
        ${faNum(i.no)}
      </div>

      <div>
        <b>تاریخ:</b>
        ${i.date}
      </div>
    </div>

  </div>

  <table style="width:100%;border-collapse:collapse;margin-bottom:15px;font-size:12px;">
    <thead>
      <tr style="background:#eee;border-bottom:1px solid #ccc;">
        <th style="padding:8px;border:1px solid #ddd;text-align:center">ردیف</th>
        <th style="padding:8px;border:1px solid #ddd;">نوع کالا</th>
        <th style="padding:8px;border:1px solid #ddd;">مدل کالا</th>
        <th style="padding:8px;border:1px solid #ddd;text-align:center">تعداد</th>
        <th style="padding:8px;border:1px solid #ddd;">قیمت واحد</th>
        <th style="padding:8px;border:1px solid #ddd;">مبلغ کل</th>
      </tr>
    </thead>
    <tbody>
      ${rows}
    </tbody>
  </table>

  <div style="border:1px solid #ccc;padding:10px;border-radius:8px;background:#f9f9f9;font-size:13px;margin-bottom:15px;">
    <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
      <span>مبلغ قابل پرداخت:</span>
      <b>${money(fromToman(i.total,invoiceUnit),invoiceUnit)}</b>
    </div>
    <div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;color:#555">
      <span>پرداختی:</span>
      <span>${money(fromToman(i.paid,invoiceUnit),invoiceUnit)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#555">
      <span>مانده حساب:</span>
      <span>${money(fromToman(i.remaining,invoiceUnit),invoiceUnit)}</span>
    </div>
  </div>
</div>

<br>
<div class="noPrint" style="display:flex;gap:10px">
  <button class="secondary" onclick="window.print()">🖨 چاپ</button>
  <button class="close" type="button" onclick="closeModal()" style="margin-right:auto;width:auto;padding:0 15px;font-size:14px;">بستن</button>
</div>
`);

const savedLogo=localStorage.getItem("barfInvoiceLogo");
const logoImg=document.getElementById("invoiceLogoPreview");
const logoText=document.getElementById("invoiceLogoText");
const logoRemove=document.getElementById("removeInvoiceLogoBtn");
const logoWrap=document.getElementById("invoiceLogoWrap");
if(savedLogo && logoImg){
  logoImg.src=savedLogo;
  logoImg.style.display="block";
  if(logoText) logoText.style.display="none";
  if(logoRemove) logoRemove.style.display="block";
  if(logoWrap) logoWrap.classList.remove("noLogo");
}
};

window.deleteInvoice=async id=>{
 if(!confirm("آیا از حذف این فاکتور اطمینان دارید؟"))return;
 const inv=data.invoices.find(x=>String(x.id)===String(id));
 if(!inv)return alert("فاکتور یافت نشد.");
 let r=await sb.from("invoices").delete().eq("id",id).eq("user_id",currentUser.id);
 if(r.error)return alert(r.error.message);
 await loadData();
 render(document.querySelector(".side button.active")?.getAttribute("data-page")||"home");
};



start();
})();
</script>
</body>
</html>
