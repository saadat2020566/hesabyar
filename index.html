 if(!a.length)return'<div class="card">هنوز فاکتوری ثبت نشده است.</div>';

function customers(){main.innerHTML=`<div class="head"><h1>مشتریان</h1><button class="primary" onclick="newCustomer()">+ مشتری جدید</button></div><input id="cq" class="input" placeholder="جستجو..." oninput="filterCustomers()"><div class="table"><table><thead><tr><th>نام</th><th>تلفن</th><th>خرید کل</th><th>بدهی</th><th>عملیات</th></tr></thead><tbody id="cr"></tbody></table></div>`;filterCustomers()}

window.newProduct=()=>openModal(`<div class="modalHead"><h2>محصول جدید</h2><button class="close" type="button" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>نام</label><input id="pn" class="input"></div><div class="field"><label>واحد</label><input id="pu" class="input" value="عدد"></div><div class="field"><label>قیمت خرید</label><input id="pb" class="input" type="number" value="0"></div><div class="field"><label>قیمت فروش</label><input id="ps" class="input" type="number" value="0"></div><div class="field"><label>موجودی</label><input id="pst" class="input" type="number" value="0"></div><div class="field"><label>حداقل موجودی</label><input id="pmin" class="input" type="number" value="0"></div></div><br><button class="primary" onclick="saveProduct()">ثبت</button>`);
window.saveProduct=async()=>{let name=pn.value.trim();if(!name)return alert("نام محصول را وارد کنید");let r=await sb.from("products").insert({user_id:currentUser.id,name,unit:pu.value||"عدد",buy_price:+pb.value||0,sell_price:+ps.value||0,stock:+pst.value||0,min_stock:+pmin.value||0});if(r.error)return alert(r.error.message);await loadData();closeModal();render("products")};

window.newExpense=()=>openModal(`<div class="modalHead"><h2>ثبت هزینه</h2><button class="close" type="button" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>عنوان</label><input id="en" class="input"></div><div class="field"><label>واحد پول</label><select id="expenseCurrency" class="input"><option value="تومان">تومان</option><option value="ریال">ریال</option></select></div><div class="field"><label>مبلغ</label><input id="ea" class="input" type="number"></div><div class="field full"><label>توضیحات</label><input id="enote" class="input"></div></div><br><button class="primary" onclick="saveExpense()">ثبت</button>`);
window.saveExpense=async()=>{let title=en.value.trim(),inputAmount=+ea.value||0,unit=document.getElementById("expenseCurrency")?.value||"تومان";if(!title||!inputAmount)return alert("عنوان و مبلغ را وارد کنید");let amount=toToman(inputAmount,unit);let r=await sb.from("expenses").insert({user_id:currentUser.id,title,amount,note:enote.value.trim()}).select().single();if(r.error)return alert(r.error.message);setExpenseCurrency(r.data.id,unit);await loadData();closeModal();render("finance")};

window.newInvoice=()=>{
currentInvoiceItems=[];
let opts=data.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
let defaultNo=data.invoices.reduce((m,x)=>Math.max(m,+x.no||0),1023)+1;
let defaultDate=new Intl.DateTimeFormat("fa-IR").format(new Date());
window._invoiceCurrency="تومان";

openModal(`<div class="modalHead"><h2>فاکتور جدید</h2><button class="close" type="button" onclick="closeModal()">×</button></div>
<div class="field">
  <label>شماره فاکتور</label>
  <input
    id="invoiceNo"
    class="input"
    type="text"
    inputmode="numeric"
    autocomplete="off"
    dir="ltr"
    style="text-align:right"
    oninput="
      this.value = this.value
        .replace(/0/g,'۰')
        .replace(/1/g,'۱')
        .replace(/2/g,'۲')
        .replace(/3/g,'۳')
        .replace(/4/g,'۴')
        .replace(/5/g,'۵')
        .replace(/6/g,'۶')
        .replace(/7/g,'۷')
        .replace(/8/g,'۸')
        .replace(/9/g,'۹')
        .replace(/[^۰-۹]/g,'');
    "
  >
</div>
</div>
  <div class="field"><label>تاریخ</label><input id="invDate" class="input" value="${defaultDate}"></div>
  <div class="field full"><label>مشتری</label><select id="ic" class="input"><option value="">متفرقه</option>${opts}</select></div>
<div class="field full"><label>واحد پول</label><select id="invoiceCurrency" class="input" onchange="updateInvoiceCurrency()"><option value="تومان">تومان</option><option value="ریال">ریال</option></select></div>
</div>
<div class="sectionTitle" style="margin-top:12px"><h3>اقلام فاکتور</h3><button class="secondary" onclick="openAddItemModal()">+ افزودن محصول</button></div>
<div class="table"><table><thead><tr><th>نوع کالا</th><th>مدل</th><th>تعداد</th><th>قیمت واحد</th><th>قیمت کل</th><th></th></tr></thead><tbody id="invoiceItemsList"><tr><td colspan="6" style="text-align:center;color:#78837f">هنوز محصولی اضافه نشده است</td></tr></tbody></table></div>
<div class="totals"><div class="tr"><span>جمع کالا</span><b id="sub">۰ تومان</b></div><div class="tr"><span>درصد تخفیف (%)</span><input id="disc" class="input" type="number" value="0" min="0" max="100" style="max-width:150px" oninput="updateInvoiceTotals()"></div><div class="tr final"><span>مبلغ نهایی</span><b id="total">۰ تومان</b></div><div class="tr"><span>پرداخت</span><input id="paid" class="input" type="number" value="0" style="max-width:150px" oninput="updateInvoiceTotals()"></div><div class="tr"><span>مانده</span><b id="remain">۰ تومان</b></div></div><br><button class="primary fullBtn" style="width:100%" onclick="saveInvoice()">صدور فاکتور</button>`);
updateInvoiceTotals();
};

window.openAddItemModal=()=>{
let unit=currencyUnit();let opts=data.products.map(p=>`<option value="${p.id}" data-price="${fromToman(p.sell,unit)}">${esc(p.name)} (${money(fromToman(p.sell,unit),unit)})</option>`).join("");
document.getElementById("subBox").innerHTML=`
<div class="modalHead"><h2>افزودن محصول به فاکتور</h2><button class="close" type="button" onclick="closeSubModal()">×</button></div>
<div class="field full"><label>نوع کالا</label><input id="subProdName" class="input"></div>
<div class="field full"><label>مدل کالا</label><input id="subProdModel" class="input"></div>
${opts?`<div class="field full"><label>انتخاب از محصولات ثبت شده</label><select id="subProd" class="input" onchange="onSubProdChange()"><option value="">-- انتخاب کنید --</option>${opts}</select></div>`:""}
<div class="field full"><label>تعداد</label><input id="subQty" class="input" type="number" min="1" value="1" oninput="onSubCalc()"></div>
<div class="field full"><label>قیمت واحد</label><input id="subUnit" class="input" type="number" oninput="onSubCalc()"></div>
<div class="field full"><label>قیمت کل</label><input id="subTotal" class="input" type="number" readonly style="background:#f4f7f6;font-weight:bold;color:#176b5b"></div>
<br><button class="primary fullBtn" style="width:100%" onclick="confirmAddItem()">ثبت</button>`;
document.getElementById("subModal").classList.add("open");
};

window.closeSubModal=()=>{
document.getElementById("subModal").classList.remove("open");
};
window.closeSubModal = closeSubModal;

document.getElementById("subModal").onclick=e=>{if(e.target.id==="subModal")closeSubModal()};

window.updateInvoiceCurrency=()=>{
  let next=currencyUnit();
  let prev=window._invoiceCurrency||"تومان";
  if(prev===next){updateInvoiceTotals();return;}
  let ratio=currencyFactor(next)/currencyFactor(prev);
  currentInvoiceItems=currentInvoiceItems.map(x=>({...x,unit:x.unit*ratio,total:x.total*ratio}));
  let paid=document.getElementById("paid");
  if(paid) paid.value=(+paid.value||0)*ratio;
  window._invoiceCurrency=next;
  renderInvoiceItems();
  updateInvoiceTotals();
};

window.onSubProdChange=()=>{
let sel=document.getElementById("subProd");
let opt=sel.options[sel.selectedIndex];
if(opt && opt.value){
  document.getElementById("subProdName").value=opt.text.split(" (")[0];
  let price=+(opt.getAttribute("data-price")||0);
  document.getElementById("subUnit").value=price;
  onSubCalc();
}
};

window.onSubCalc=()=>{
let q=+document.getElementById("subQty").value||0;
let u=+document.getElementById("subUnit").value||0;
document.getElementById("subTotal").value=q*u;
};

window.confirmAddItem=()=>{
let name=document.getElementById("subProdName").value.trim();
let model=document.getElementById("subProdModel").value.trim();
let q=+document.getElementById("subQty").value||0;
let u=+document.getElementById("subUnit").value||0;
let t=q*u;
if(!name||q<=0){alert("نوع کالا و تعداد را وارد کنید");return;}

let p=data.products.find(x=>x.name===name);
if(!p){p={id: null, name: name, stock: 999999};}

if(p.id && q>p.stock){alert("موجودی کافی نیست! موجودی انبار: "+p.stock);return;}
currentInvoiceItems.push({p, model, q, unit:u, total:t});
closeSubModal();
renderInvoiceItems();
};

window.removeInvoiceItem=index=>{
currentInvoiceItems.splice(index, 1);
renderInvoiceItems();
};

window.renderInvoiceItems=()=>{
let tbody=document.getElementById("invoiceItemsList");
if(!currentInvoiceItems.length){
  tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;color:#78837f">هنوز محصولی اضافه نشده است</td></tr>`;
  updateInvoiceTotals();
  return;
}
tbody.innerHTML=currentInvoiceItems.map((item, idx)=>`
<tr>
  <td>${esc(item.p.name)}</td>
  <td>${esc(item.model||'-')}</td>
  <td>${item.q}</td>
  <td>${money(item.unit)}</td>
  <td>${money(item.total)}</td>
  <td><button class="close" type="button" style="width:26px;height:26px;font-size:12px" onclick="removeInvoiceItem(${idx})">×</button></td>
</tr>`).join("");
updateInvoiceTotals();
};

function updateInvoiceTotals(){
let sub=currentInvoiceItems.reduce((a,b)=>a+b.total,0);
let discPercent=+document.getElementById("disc")?.value||0;
let discountAmount = sub * (discPercent / 100);
let total=Math.max(0, sub - discountAmount);
let p=+document.getElementById("paid")?.value||0;
let remain=Math.max(0, total-p);

let unit=currencyUnit();
if(document.getElementById("sub")) document.getElementById("sub").textContent=money(sub,unit);
if(document.getElementById("total")) document.getElementById("total").textContent=money(total,unit);
if(document.getElementById("remain")) document.getElementById("remain").textContent=money(remain,unit);
}
window.updateInvoiceTotals = updateInvoiceTotals;

window.saveInvoice=async()=>{
if(!currentInvoiceItems.length){alert("حداقل یک محصول اضافه کنید");return;}

let sub=currentInvoiceItems.reduce((a,b)=>a+b.total,0);
let discPercent=+document.getElementById("disc").value||0;
let discountAmount = sub * (discPercent / 100);
let total=Math.max(0, sub - discountAmount);
let pay=Math.min(total,+document.getElementById("paid").value||0);
let remaining=total-pay;
let invoiceUnit=currencyUnit();
let dbSub=toToman(sub,invoiceUnit),dbDiscount=toToman(discountAmount,invoiceUnit),dbTotal=toToman(total,invoiceUnit),dbPay=toToman(pay,invoiceUnit),dbRemaining=toToman(remaining,invoiceUnit);
let cid=document.getElementById("ic").value||null;
let c=cid?data.customers.find(x=>String(x.id)===cid):null;
function faToEnDigits(value){
  return String(value ?? "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
}

let no=+faToEnDigits(document.getElementById("invoiceNo").value)||(data.invoices.reduce((m,x)=>Math.max(m,+x.no||0),1023)+1);
let invoiceDate=document.getElementById("invDate").value;

let inv=await sb.from("invoices").insert({
  user_id:currentUser.id,
  invoice_no:no,
  invoice_date:invoiceDate,
  customer_id:cid?+cid:null,
  customer_name:c?.name||"مشتری متفرقه",
  subtotal:dbSub,
  discount:dbDiscount,
  total:dbTotal,
  paid:dbPay,
  remaining:dbRemaining
}).select().single();
if(inv.error){
  const msg=String(inv.error.message||"");

  if(
    msg.includes("duplicate key") ||
    msg.includes("invoices_invoice_no_key")
  ){
    return alert(
      "شماره فاکتور تکراری است.\n\n" +
      "این شماره قبلاً برای یک فاکتور استفاده شده است.\n" +
      "لطفاً شماره فاکتور دیگری وارد کنید."
    );
  }

  return alert("خطا در ثبت فاکتور:\n" + msg);
}

let ir=await sb.from("invoice_items").insert(currentInvoiceItems.map(x=>({user_id:currentUser.id,invoice_id:inv.data.id,product_id:x.p.id,product_name:x.p.name+" | مدل: "+(x.model||'-'),quantity:x.q,unit_price:toToman(x.unit,invoiceUnit),line_total:toToman(x.total,invoiceUnit)})));
if(ir.error){await sb.from("invoices").delete().eq("id",inv.data.id);return alert(ir.error.message)}

for(const x of currentInvoiceItems){
  if(x.p.id){
    await sb.from("products").update({stock:x.p.stock-x.q}).eq("id",x.p.id).eq("user_id",currentUser.id);
  }
}
if(c){
  await sb.from("customers").update({total_purchases:c.purchases+dbTotal,debt:c.debt+dbRemaining}).eq("id",c.id).eq("user_id",currentUser.id);
}
setInvoiceCurrency(inv.data.id,invoiceUnit);
await loadData();closeModal();showInvoice(inv.data.id);
};

window.showInvoice=async id=>{
let i=data.invoices.find(x=>String(x.id)===String(id));
if(!i) return alert("خطا! فاکتور یافت نشد.");
let invoiceUnit=getInvoiceCurrency(i.id);
let r=await sb.from("invoice_items").select("*").eq("invoice_id",i.id).eq("user_id",currentUser.id).order("id");
if(r.error)return alert(r.error.message);

let rows=(r.data||[]).map((x, idx)=>{
  let parts=x.product_name.split(" | مدل: ");
  let typeName=parts[0];
  let modelName=parts[1]||"-";
  return `<tr>
    <td style="padding:8px;border:1px solid #ddd;text-align:center">${faNum(idx+1)}</td>
    <td style="padding:8px;border:1px solid #ddd;">${esc(typeName)}</td>
    <td style="padding:8px;border:1px solid #ddd;">${esc(modelName)}</td>
    <td style="padding:8px;border:1px solid #ddd;text-align:center">${faNum(x.quantity)}</td>
    <td style="padding:8px;border:1px solid #ddd;">${money(fromToman(x.unit_price,invoiceUnit),invoiceUnit)}</td>
    <td style="padding:8px;border:1px solid #ddd;">${money(fromToman(x.line_total,invoiceUnit),invoiceUnit)}</td>
  </tr>`;
}).join("");

window.deleteInvoice=async id=>{
 if(!confirm("آیا از حذف این فاکتور اطمینان دارید؟"))return;
 const inv=data.invoices.find(x=>String(x.id)===String(id));
 if(!inv)return alert("فاکتور یافت نشد.");
 let r=await sb.from("invoices").delete().eq("id",id).eq("user_id",currentUser.id);
 if(r.error)return alert(r.error.message);
 await loadData();
 render(document.querySelector(".side button.active")?.getAttribute("data-page")||"home");
};



start();
})();
