name: Barf Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Cordova
        run: npm install -g cordova@13.0.0

      - name: Prepare project
        run: |
          rm -rf build-app
          cordova create build-app com.barf.app "برف"
          cp index.html build-app/www/index.html
          cp config.xml build-app/config.xml
          for f in service-worker.js sw.js manifest.json manifest.webmanifest icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" "build-app/www/$f"; fi
          done
          cd build-app
          cordova platform add android@15.0.0

      - name: Build Release APK
        working-directory: build-app
        run: cordova build android --release

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.BARF_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BARF_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.BARF_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BARF_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Signing secrets are missing."
            exit 1
          fi
          echo "$KS_B64" | base64 --decode > barf-release.jks
          zipalign -p -f 4 build-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          apksigner sign --ks barf-release.jks --ks-key-alias "$ALIAS" --ks-pass pass:"$KS_PASS" --key-pass pass:"$KEY_PASS" --out barf-cafebazaar-release.apk aligned.apk
          apksigner verify --verbose barf-cafebazaar-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barf-cafebazaar-release
          path: barf-cafebazaar-release.apk
          if-no-files-found: error
